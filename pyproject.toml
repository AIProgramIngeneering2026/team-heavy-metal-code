[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "heavy-metal-code"
version = "0.1.0"
description = "Core and HTTP API for checking educational GitHub repositories"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115,<1",
    "pydantic>=2.9,<3",
    "uvicorn>=0.30,<1",
]

[project.optional-dependencies]
dev = ["pytest>=9,<10", "httpx>=0.27,<1", "PyYAML>=6,<7", "jsonschema>=4,<5"]

[tool.setuptools]
packages = ["core", "application", "api"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--import-mode=importlib"
